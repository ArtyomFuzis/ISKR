---
  - name: Deploy monalog
    hosts: deploy_esb_monalog
    tasks: 
      - name: Give access to socket for install user
        file: 
          path: "/var/run/docker.sock"
          state: file 
          owner: "{{ansible_user}}"
        become: yes
      
      - name: Down app 
        shell: "cd {{base_path}}/docker/ && docker compose -f esb_monalog.yml down"
        ignore_errors: yes
      
      - name: Ensure that monalog dir exists
        file: 
          path: "{{base_path}}/docker/monalog"
          state: directory

      - name: Copy conf 
        synchronize:
          src: "/workspace/monalog/"
          dest: "{{base_path}}/docker/monalog"

      - name: Copy docker template 
        template: 
          src: "/workspace/templates/esb/monalog.j2"
          dest: "{{base_path}}/docker/esb_monalog.yml"
      
      - name: Build image 
        shell: "cd {{base_path}}/docker/ && docker compose -f esb_monalog.yml build"

      - name: Pull image 
        shell: "cd {{base_path}}/docker/ && docker compose -f esb_monalog.yml pull"
    
      - name: Start consul
        shell: |
          cd {{base_path}}/docker/ && \
          docker compose -f esb_monalog.yml up -d